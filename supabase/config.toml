# إعدادات Supabase CLI
# التشغيل:
#   supabase link --project-ref kcuyctrchvfdjiyggkau
#   supabase db push
project_id = "kcuyctrchvfdjiyggkau"

[db]
major_version = 17

[auth]
enabled = true
# 👈 غيّرها لدومينك الحقيقي بعد النشر
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
# الرابط السحري — مهم لناس الشركات اللي أجهزتهم بتمنع الدخول بجوجل
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"
